[project]
name = "home-dns"
version = "0.1.0"
description = "Home DNS security, filtering, monitoring and dashboard backend"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "annotated-types>=0.7",
    "fastapi>=0.115",
    "httpx>=0.28",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "pyyaml>=6.0.2",
    "uvicorn>=0.32",
]

[project.scripts]
home-dns = "home_dns.cli:main"

[dependency-groups]
dev = [
    "mypy>=1.13",
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "ruff>=0.8",
    "types-PyYAML>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/home_dns"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "RUF", "PT"]

[tool.ruff.lint.isort]
known-first-party = ["home_dns", "tests"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "S108", "PT018"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]
files = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = [
    "-ra",
    "--strict-markers",
    "-m", "not network",
    "--cov=home_dns",
    "--cov-report=term-missing:skip-covered",
    "--cov-fail-under=90",
]
markers = [
    "network: needs Internet access (excluded by default; run with -m network)",
]

[tool.coverage.run]
branch = true
source = ["home_dns"]
