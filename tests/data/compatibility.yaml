# Compatibility regression catalog (A3). Used by offline tests and scripts/blocklists/evaluate_policy.py.
#
# services[].required: endpoints that must be ALLOWED for every listed group, whatever the
#   blocklists contain (they must be covered by protected domains or allow rules).
#   Names under subtree-protected namespaces are realistic example hostnames.
# must_stay_blockable: ad/telemetry names inside protected namespaces that must NOT be protected,
#   so upstream lists can keep blocking them (guards against over-broad protection).
schema_version: 1

