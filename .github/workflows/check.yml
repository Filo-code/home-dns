name: check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv (Python, pinned by .python-version)
        uses: astral-sh/setup-uv@v3

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: make setup
        run: make setup

      - name: make check
        run: make check
