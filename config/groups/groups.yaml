# Device policy groups (ADR 0003).
#
# Adding a group later = add one entry here that points at a policy. No code changes.
# Group ids: upper-case words joined by "-". DEFAULT is required: unassigned devices use it.
#
# Device-to-group assignments are NOT stored here. They live in backend storage (A7), so
# the dashboard can change them and no real network identifiers enter the repository.
schema_version: 1

groups:
  - id: DEFAULT
    description: Devices not yet assigned to a specific group.
    policy: standard
  - id: PC
    description: Windows PCs.
    policy: standard
  - id: GAMING
    description: Gaming PCs. Must not break launchers, anti-cheat, voice chat or downloads.
    policy: conservative
  - id: MOBILE
    description: Smartphones and iPads. Social networks must remain fully functional.
    policy: standard
  - id: SMART-TV
    description: Smart TVs. Preserve streaming, DRM, casting, app stores, updates and CDNs.
    policy: conservative
  - id: XBOX
    description: Xbox. Preserve Xbox Live, Microsoft account, multiplayer, Game Pass, Store, parties.
    policy: conservative
