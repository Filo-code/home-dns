# Filtering policies (ADR 0003, ADR 0009). Each group points at exactly one policy.
# Decided in A3 from the evaluation in docs/research/2026-09-14-a3-policy-evaluation.md.
# To refine a group later, change its policy's lists or give the group its own policy; no code change.
schema_version: 1

policies:
  - id: standard
    description: >-
      Strong ad, tracker, telemetry and threat protection for PCs, phones, tablets and unassigned
      devices. Social-network, streaming and banking core domains are protected.
    blocklists:
      - hagezi-multi-pro
      - hagezi-tif-mini

  - id: gaming
    description: >-
      All-round protection for gaming PCs. Normal avoids Pro-only blocks of crash-reporting and
      telemetry endpoints used by some launchers and games; launchers and anti-cheat are
      unaffected by every evaluated list.
    blocklists:
      - hagezi-normal
      - hagezi-tif-mini

  - id: smart-tv
    description: >-
      Conservative but real protection for Smart TVs: Light blocks TV-vendor ad domains, trackers
      and telemetry; TIF Mini blocks malware and phishing. Avoids Normal/Pro-only blocks of
      Prime Video ad-roll hosts and Netflix logging that can disturb playback.
    blocklists:
      - hagezi-light
      - hagezi-tif-mini

  - id: console
    description: >-
      Conservative but real protection for Xbox: Xbox network, Store, Game Pass, multiplayer and
      party endpoints are unaffected by Light and TIF Mini; avoids Normal/Pro-only blocks of
      PlayFab title endpoints and streaming ad-roll hosts.
    blocklists:
      - hagezi-light
      - hagezi-tif-mini
