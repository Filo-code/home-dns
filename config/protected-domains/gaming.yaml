# Protected domains: gaming (ADR 0003, A3 design docs/specs/a3-filtering-policy.md).
# Domains here are never blocked. A deny rule or regex touching one is a configuration error,
# and the A2 pipeline aborts any blocklist deployment that contains one.
# include_subdomains: true only for single-tenant namespaces with no listed names inside
# (checked against 8 real HaGeZi lists on 2026-09-14); otherwise exact.
